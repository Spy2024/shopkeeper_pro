name: Build Release APK

on:
  push:
    branches: [ "main", "master", "feature/*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter code
        shell: bash
        run: |
          set +e
          flutter analyze --no-pub > /tmp/flutter-analyze.log 2>&1
          analyze_status=$?
          cat /tmp/flutter-analyze.log
          if grep -E '(^|[[:space:]])error[[:space:]]+[•-]' /tmp/flutter-analyze.log; then
            exit 1
          fi
          echo "No Dart/Flutter analyzer errors found (style infos are reported above)."
          exit 0

      - name: Run Tests
        run: flutter test

      - name: Compile web dashboard
        run: >-
          flutter build web --release --target=lib/web_main.dart
          --dart-define=FIREBASE_PROJECT_ID=ci-placeholder
          --dart-define=FIREBASE_WEB_API_KEY=ci-placeholder
          --dart-define=FIREBASE_WEB_APP_ID=ci-placeholder
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=ci-placeholder
          --dart-define=FIREBASE_AUTH_DOMAIN=ci-placeholder
          --dart-define=FIREBASE_STORAGE_BUCKET=ci-placeholder

      - name: Check cargo tracking function syntax
        run: node --check functions/index.js

      - name: Install Firebase rules test dependencies
        run: npm install --prefix tests/firestore-rules

      - name: Test Firestore account-isolation rules in emulator
        run: |
          npm install --global firebase-tools
          firebase emulators:exec --only firestore --project shopkeeper-2de9a "npm test --prefix tests/firestore-rules"

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shopkeeper-pro-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
