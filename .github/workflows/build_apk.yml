name: Build Release-variant Test APK

on:
  push:
    branches: [ "main", "master", "feature/*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Analyze, test and build Android test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run unit tests
        run: flutter test

      - name: Build release-variant test APK (debug-key signed)
        run: flutter build apk --release

      - name: Upload release-variant test APK (not production signed)
        uses: actions/upload-artifact@v4
        with:
          name: shopkeeper-pro-release-test-apk-debug-signed
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
