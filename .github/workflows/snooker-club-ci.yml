name: Snooker Club CI

on:
  push:
    branches:
      - feature/snooker-club-management
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analyze, tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shopkeeper-pro-snooker-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  firestore-rules:
    name: Firestore rules and account isolation tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install rules-test dependencies
        run: npm install
      - name: Run Firestore emulator rules tests
        run: npm run test:rules
