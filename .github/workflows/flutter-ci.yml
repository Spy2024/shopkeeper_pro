name: Flutter CI

on:
  push:
    branches:
      - main
      - feature/production-ready-fixes
      - feature/shopkeeper-production-hardening
      - fix/account-scoped-sync-queue
      - fix/production-audit-2026-10
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - feature/production-ready-fixes
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build release APK only after feature verification is complete'
        required: true
        type: boolean
        default: false

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show Flutter version
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run automated tests
        run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shopkeeper-pro-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Validate Android release signing secrets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name. Configure all Android signing secrets before requesting a release build."
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/shopkeeper-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed release APK (manual opt-in only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk }}
        run: flutter build apk --release
      - name: Upload signed release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: shopkeeper-pro-signed-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
