name: Flutter CI

on:
  push:
    branches:
      - main
      - feature/production-ready-fixes
      - feature/shopkeeper-production-hardening
      - fix/account-scoped-sync-queue
      - fix/production-audit-2026-10
  pull_request:
    branches:
      - main
      - feature/production-ready-fixes
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build release APK only after feature verification is complete'
        required: true
        type: boolean
        default: false

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show Flutter version
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run automated tests
        run: flutter test
      - name: Build release APK (manual opt-in only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk }}
        run: flutter build apk --release
