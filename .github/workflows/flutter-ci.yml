name: Flutter CI

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build a signed release APK only after release readiness and signing secrets are verified'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze, test and build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run automated tests
        run: flutter test
      - name: Compile web dashboard
        run: >-
          flutter build web --release --target=lib/web_main.dart
          --dart-define=FIREBASE_PROJECT_ID=ci-placeholder
          --dart-define=FIREBASE_WEB_API_KEY=ci-placeholder
          --dart-define=FIREBASE_WEB_APP_ID=ci-placeholder
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=ci-placeholder
          --dart-define=FIREBASE_AUTH_DOMAIN=ci-placeholder
          --dart-define=FIREBASE_STORAGE_BUCKET=ci-placeholder
      - name: Check Cloud Functions syntax
        run: node --check functions/index.js
      - name: Install Firestore rules test dependencies
        run: npm install --prefix tests/firestore-rules
      - name: Set up Java 21 for Firebase emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Test Firestore account-isolation rules in emulator
        run: |
          npm install --global firebase-tools
          firebase emulators:exec --only firestore --project shopkeeper-2de9a "npm test --prefix tests/firestore-rules"
      - name: Restore Java 17 for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shopkeeper-pro-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Validate Android release signing secrets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name. Configure all Android signing secrets before requesting a release build."
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/shopkeeper-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed release APK (manual opt-in only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk }}
        run: flutter build apk --release
      - name: Upload signed release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: shopkeeper-pro-signed-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
