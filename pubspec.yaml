name: shopkeeper_pro
description: "Offline-first shop management app for local retailers — billing, inventory, suppliers, sales, and net profit tracking."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Offline-first local storage
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # Firebase / cloud sync infrastructure
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.3.0

  # Security
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3

  # PDF invoice / purchase-order generation
  pdf: ^3.11.1
  printing: ^5.13.2

  # Sharing to WhatsApp / SMS / generic share sheet
  share_plus: ^9.0.0
  url_launcher: ^6.3.0

  # Image picking for shop logo
  image_picker: ^1.1.2

  # Charts for the financial dashboard
  fl_chart: ^0.68.0

  # Formatting
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
