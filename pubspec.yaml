name: shopkeeper_pro
description: Android-first shopkeeper management app - production ready with offline-first, Firebase sync and invoice generation.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.2
  
  # Firebase - Core (v3 compatible with share_plus 10+)
  firebase_core: ^3.10.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.5

  # Local Database - Offline First
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Invoice & PDF
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^10.0.2
  image_picker: ^1.1.2
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^5.0.2
  fl_chart: ^0.69.2

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
